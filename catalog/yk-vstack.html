<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-vstack&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js"></script>
    <script type="module" src="./catalog.js"></script>
  </head>
  <body data-component="yk-vstack">
    <div class="catalog">
      <aside class="catalog__sidebar" data-sidebar></aside>

      <main class="catalog__main">
        <header class="catalog__componentHeader" data-component-header></header>

        <section class="catalog__interface" data-interface></section>

        <figure class="catalog__variation">
          <figcaption class="catalog__variationTitle">Default</figcaption>
          <div class="catalog__demo">
            <yk-vstack>
              <p class="demoItem">First item</p>
              <p class="demoItem">Second item</p>
              <p class="demoItem">Third item</p>
            </yk-vstack>
          </div>
          <pre class="catalog__code"><code>&lt;yk-vstack&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
&lt;/yk-vstack&gt;</code></pre>
        </figure>

        <figure class="catalog__variation">
          <figcaption class="catalog__variationTitle">Custom gap</figcaption>
          <div class="catalog__demo">
            <yk-vstack style="--yk-vstack-gap: 2rem">
              <p class="demoItem">First item</p>
              <p class="demoItem">Second item</p>
              <p class="demoItem">Third item</p>
            </yk-vstack>
          </div>
          <pre class="catalog__code"><code>&lt;yk-vstack style="--yk-vstack-gap: 2rem"&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
&lt;/yk-vstack&gt;</code></pre>
        </figure>

        <figure class="catalog__variation">
          <figcaption class="catalog__variationTitle">Nested stacks</figcaption>
          <div class="catalog__demo">
            <yk-vstack>
              <p class="demoItem">Section heading</p>
              <yk-vstack style="--yk-vstack-gap: 0.25rem">
                <p class="demoItem">Sub item</p>
                <p class="demoItem">Sub item</p>
              </yk-vstack>
            </yk-vstack>
          </div>
          <pre class="catalog__code"><code>&lt;yk-vstack&gt;
  &lt;p&gt;Section heading&lt;/p&gt;
  &lt;yk-vstack style="--yk-vstack-gap: 0.25rem"&gt;
    &lt;p&gt;Sub item&lt;/p&gt;
    &lt;p&gt;Sub item&lt;/p&gt;
  &lt;/yk-vstack&gt;
&lt;/yk-vstack&gt;</code></pre>
        </figure>
      </main>

      <footer class="catalog__footer">
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
