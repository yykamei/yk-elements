<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-input-password&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js" blocking="render"></script>
    <script type="module" src="./catalog.js" blocking="render"></script>
  </head>
  <body data-component="yk-input-password">
    <yk-soft-nav></yk-soft-nav>
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-playground></section>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>autocomplete (current-password)</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password autocomplete="current-password"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password autocomplete="current-password"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>autocomplete (new-password)</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password autocomplete="new-password"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password autocomplete="new-password"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>inputmode (numeric PIN)</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password inputmode="numeric" minlength="4" maxlength="8" placeholder="4–8 digits"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password inputmode="numeric" minlength="4" maxlength="8" placeholder="4–8 digits"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>placeholder</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password placeholder="8+ characters"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password placeholder="8+ characters"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>value</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password value="prefilled"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password value="prefilled"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>minlength + maxlength</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password minlength="8" maxlength="16" placeholder="8–16 characters"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password minlength="8" maxlength="16" placeholder="8–16 characters"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>pattern</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password pattern="[a-z0-9]{8,}" placeholder="8+ lowercase letters and digits" title="Use 8 or more lowercase letters and digits"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password pattern="[a-z0-9]{8,}" placeholder="8+ lowercase letters and digits" title="Use 8 or more lowercase letters and digits"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>required</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password required name="password" placeholder="required field"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password required name="password" placeholder="required field"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>readonly</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password readonly value="read-only value"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password readonly value="read-only value"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>disabled</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-password disabled value="disabled value"></yk-input-password>
          </yk-pad>
          <pre><code>&lt;yk-input-password disabled value="disabled value"&gt;&lt;/yk-input-password&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>label and submission inside a form</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <form onsubmit="event.preventDefault()">
              <yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)">
                <label for="catalog-password">Password</label>
                <yk-input-password id="catalog-password" name="password" minlength="8" autocomplete="current-password" required placeholder="8+ characters"></yk-input-password>
                <yk-button type="submit" variant="primary">Sign in</yk-button>
              </yk-vstack>
            </form>
          </yk-pad>
          <pre><code>&lt;form onsubmit="event.preventDefault()"&gt;
  &lt;yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)"&gt;
    &lt;label for="catalog-password"&gt;Password&lt;/label&gt;
    &lt;yk-input-password id="catalog-password" name="password" minlength="8" autocomplete="current-password" required placeholder="8+ characters"&gt;&lt;/yk-input-password&gt;
    &lt;yk-button type="submit" variant="primary"&gt;Sign in&lt;/yk-button&gt;
  &lt;/yk-vstack&gt;
&lt;/form&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
