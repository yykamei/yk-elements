<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-soft-nav&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../fouc.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../src/components/yk-theme-init.js" blocking="render"></script>
    <script type="module" src="../index.js" blocking="render"></script>
    <script type="module" src="./catalog.js" blocking="render"></script>
  </head>
  <body data-component="yk-soft-nav">
    <yk-soft-nav></yk-soft-nav>
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <figure>
            <figcaption>Place it on every page</figcaption>
            <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
              <p class="description">
                Renders nothing and exposes no attributes, CSS custom
                properties, slots, parts, or events; placement is the entire
                API. This catalog places it at the top of every page, so
                navigating between catalog pages fades. The render-blocking
                module script applies the opt-in before the first paint.
              </p>
            </yk-pad>
            <pre><code>&lt;script type="module" src="./index.js" blocking="render"&gt;&lt;/script&gt;
&lt;yk-soft-nav&gt;&lt;/yk-soft-nav&gt;</code></pre>
          </figure>

          <figure>
            <figcaption>Both pages must opt in</figcaption>
            <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
              <p class="description">
                A transition runs only when the page being left and the page
                being entered both place the element; each page must also load
                the library module. Other same-origin navigations repaint as
                usual. Browsers without support, and visitors who prefer
                reduced motion, navigate without the fade.
              </p>
            </yk-pad>
            <pre><code>&lt;!-- page-a.html --&gt;
&lt;yk-soft-nav&gt;&lt;/yk-soft-nav&gt;

&lt;!-- page-b.html --&gt;
&lt;yk-soft-nav&gt;&lt;/yk-soft-nav&gt;</code></pre>
          </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
