<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-link&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js"></script>
    <script type="module" src="./catalog.js"></script>
  </head>
  <body data-component="yk-link">
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-link href="#default">Default</yk-link>
          </yk-pad>
          <pre><code>&lt;yk-link href="#default"&gt;Default&lt;/yk-link&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>variant="primary"</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-link href="#primary" variant="primary">Primary</yk-link>
          </yk-pad>
          <pre><code>&lt;yk-link href="#primary" variant="primary"&gt;Primary&lt;/yk-link&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>variant="secondary"</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-link href="#secondary" variant="secondary">Secondary</yk-link>
          </yk-pad>
          <pre><code>&lt;yk-link href="#secondary" variant="secondary"&gt;Secondary&lt;/yk-link&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>variant="danger"</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-link href="#danger" variant="danger">Danger</yk-link>
          </yk-pad>
          <pre><code>&lt;yk-link href="#danger" variant="danger"&gt;Danger&lt;/yk-link&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>target="_blank"</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-link
              href="https://github.com/yykamei/yk-elements"
              target="_blank"
              rel="noopener"
              >External</yk-link
            >
          </yk-pad>
          <pre><code>&lt;yk-link
  href="https://github.com/yykamei/yk-elements"
  target="_blank"
  rel="noopener"&gt;
  External
&lt;/yk-link&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
