<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-textarea&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../fouc.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../src/components/yk-theme-init.js" blocking="render"></script>
    <script type="module" src="../index.js" blocking="render"></script>
    <script type="module" src="./catalog.js" blocking="render"></script>
  </head>
  <body data-component="yk-textarea">
    <yk-soft-nav></yk-soft-nav>
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-playground></section>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>placeholder</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea placeholder="Explain the meaning in English"></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea placeholder="Explain the meaning in English"&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>rows</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea rows="5" placeholder="Five lines tall"></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea rows="5" placeholder="Five lines tall"&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>value</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea value="prefilled meaning"></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea value="prefilled meaning"&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>minlength + maxlength</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea minlength="4" maxlength="40" placeholder="4–40 characters"></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea minlength="4" maxlength="40" placeholder="4–40 characters"&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>required</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea required name="meaning" placeholder="required field"></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea required name="meaning" placeholder="required field"&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>readonly</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea readonly value="read-only meaning"></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea readonly value="read-only meaning"&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>disabled</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-textarea disabled value="disabled meaning"></yk-textarea>
          </yk-pad>
          <pre><code>&lt;yk-textarea disabled value="disabled meaning"&gt;&lt;/yk-textarea&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>label and submission inside a form</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <form onsubmit="event.preventDefault()">
              <yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)">
                <label for="catalog-meaning">Meaning</label>
                <yk-textarea id="catalog-meaning" name="meaning" rows="3" minlength="4" placeholder="4+ characters"></yk-textarea>
                <yk-button type="submit" variant="primary">Save</yk-button>
              </yk-vstack>
            </form>
          </yk-pad>
          <pre><code>&lt;form onsubmit="event.preventDefault()"&gt;
  &lt;yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)"&gt;
    &lt;label for="catalog-meaning"&gt;Meaning&lt;/label&gt;
    &lt;yk-textarea id="catalog-meaning" name="meaning" rows="3" minlength="4" placeholder="4+ characters"&gt;&lt;/yk-textarea&gt;
    &lt;yk-button type="submit" variant="primary"&gt;Save&lt;/yk-button&gt;
  &lt;/yk-vstack&gt;
&lt;/form&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
