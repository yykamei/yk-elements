<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-grid&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js"></script>
    <script type="module" src="./catalog.js"></script>
  </head>
  <body data-component="yk-grid">
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-grid>
              <p class="demo-item">First item</p>
              <p class="demo-item">Second item</p>
              <p class="demo-item">Third item</p>
              <p class="demo-item">Fourth item</p>
            </yk-grid>
          </yk-pad>
          <pre><code>&lt;yk-grid&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
  &lt;p&gt;Fourth item&lt;/p&gt;
&lt;/yk-grid&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>Custom min column width</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-grid style="--yk-grid-min: 12rem">
              <p class="demo-item">First item</p>
              <p class="demo-item">Second item</p>
              <p class="demo-item">Third item</p>
              <p class="demo-item">Fourth item</p>
            </yk-grid>
          </yk-pad>
          <pre><code>&lt;yk-grid style="--yk-grid-min: 12rem"&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
  &lt;p&gt;Fourth item&lt;/p&gt;
&lt;/yk-grid&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
