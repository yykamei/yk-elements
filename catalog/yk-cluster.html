<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-cluster&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js" blocking="render"></script>
    <script type="module" src="./catalog.js" blocking="render"></script>
  </head>
  <body data-component="yk-cluster">
    <yk-soft-nav></yk-soft-nav>
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-playground></section>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-cluster>
              <p class="demo-item">First item</p>
              <p class="demo-item">Second item</p>
              <p class="demo-item">Third item</p>
            </yk-cluster>
          </yk-pad>
          <pre><code>&lt;yk-cluster&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
&lt;/yk-cluster&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>Wrapping</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-cluster style="inline-size: 16rem">
              <p class="demo-item">First item</p>
              <p class="demo-item">Second item</p>
              <p class="demo-item">Third item</p>
              <p class="demo-item">Fourth item</p>
              <p class="demo-item">Fifth item</p>
            </yk-cluster>
          </yk-pad>
          <pre><code>&lt;yk-cluster style="inline-size: 16rem"&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
  &lt;p&gt;Fourth item&lt;/p&gt;
  &lt;p&gt;Fifth item&lt;/p&gt;
&lt;/yk-cluster&gt;</code></pre>
        </figure>

            <yk-cluster style="--yk-cluster-align: flex-start">
              <p class="demo-item">Short item</p>

            <yk-cluster style="--yk-cluster-gap: 2rem">

            <yk-cluster style="--yk-cluster-gap: 2rem 0.5rem; inline-size: 16rem">
              <p class="demo-item">First item</p>
