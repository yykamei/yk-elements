<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yk-elements — Component catalog</title>
    <script>
      // A bare /catalog URL (no trailing slash) makes ./catalog.css and
      // ./catalog.js resolve against the parent directory and fail to load,
      // so normalize it to the trailing-slash form before resources load.
      if (
        !location.pathname.endsWith('/') &&
        !location.pathname.endsWith('.html')
      ) {
        location.replace(`${location.pathname}/`);
      }
    </script>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js"></script>
    <script type="module" src="./catalog.js"></script>
  </head>
  <body>
    <div class="catalog">
      <aside class="catalog__sidebar" data-sidebar></aside>

      <main class="catalog__main">
        <header class="catalog__overviewHeader">
          <h1 class="catalog__title">yk-elements</h1>
          <p class="catalog__tagline">
            Zero-config Web Components library. Just put, just works.
          </p>
        </header>

        <div class="catalog__landing" data-landing></div>
      </main>

      <footer class="catalog__footer">
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
