<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yk-elements — Component catalog</title>
    <script>
      // A bare /catalog URL (no trailing slash) makes ./catalog.css and
      // ./catalog.js resolve against the parent directory and fail to load,
      // so normalize it to the trailing-slash form before resources load. The
      // target is pinned to location.origin because a pathname that starts
      // with two slashes would otherwise resolve as a protocol-relative URL
      // and leave this host; query and hash are carried over too.
      if (
        !location.pathname.endsWith('/') &&
        !location.pathname.endsWith('.html')
      ) {
        const path = `/${location.pathname.replace(/^\/+/, '')}/`;
        location.replace(
          `${location.origin}${path}${location.search}${location.hash}`,
        );
      }
    </script>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../src/components/yk-theme-init.js" blocking="render"></script>
    <script type="module" src="../index.js" blocking="render"></script>
    <script type="module" src="./catalog.js" blocking="render"></script>
  </head>
  <body>
    <yk-soft-nav></yk-soft-nav>
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header>
            <yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)">
              <h1 class="title">yk-elements</h1>
              <p class="description">
                Zero-config Web Components library. Just put, just works.
              </p>
            </yk-vstack>
          </header>

          <yk-vstack
            data-landing
            style="--yk-vstack-gap: var(--yk-space-lg)"
          ></yk-vstack>

          <section data-tokens></section>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
