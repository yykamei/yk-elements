<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-input-url&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../src/components/yk-theme-init.js" blocking="render"></script>
    <script type="module" src="../index.js" blocking="render"></script>
    <script type="module" src="./catalog.js" blocking="render"></script>
  </head>
  <body data-component="yk-input-url">
    <yk-soft-nav></yk-soft-nav>
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-playground></section>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>placeholder</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url placeholder="https://example.com"></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url placeholder="https://example.com"&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>value</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url value="https://example.com/yk-elements"></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url value="https://example.com/yk-elements"&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>minlength + maxlength</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url minlength="12" maxlength="100" placeholder="12–100 characters"></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url minlength="12" maxlength="100" placeholder="12–100 characters"&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>pattern</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url pattern="https://example\.com/.+" placeholder="https://example.com/…"></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url pattern="https://example\.com/.+" placeholder="https://example.com/…"&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>required</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url required name="url" placeholder="required field"></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url required name="url" placeholder="required field"&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>readonly</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url readonly value="https://example.com/yk-elements"></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url readonly value="https://example.com/yk-elements"&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>disabled</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-input-url disabled value="https://example.com/yk-elements"></yk-input-url>
          </yk-pad>
          <pre><code>&lt;yk-input-url disabled value="https://example.com/yk-elements"&gt;&lt;/yk-input-url&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>label and submission inside a form</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <form onsubmit="event.preventDefault()">
              <yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)">
                <label for="catalog-url">Website</label>
                <yk-input-url id="catalog-url" name="url" required placeholder="https://example.com"></yk-input-url>
                <yk-button type="submit" variant="primary">Subscribe</yk-button>
              </yk-vstack>
            </form>
          </yk-pad>
          <pre><code>&lt;form onsubmit="event.preventDefault()"&gt;
  &lt;yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)"&gt;
    &lt;label for="catalog-url"&gt;Website&lt;/label&gt;
    &lt;yk-input-url id="catalog-url" name="url" required placeholder="https://example.com"&gt;&lt;/yk-input-url&gt;
    &lt;yk-button type="submit" variant="primary"&gt;Subscribe&lt;/yk-button&gt;
  &lt;/yk-vstack&gt;
&lt;/form&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
