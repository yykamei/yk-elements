<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-hstack&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js"></script>
    <script type="module" src="./catalog.js"></script>
  </head>
  <body data-component="yk-hstack">
    <div class="catalog">
      <aside class="catalog__sidebar" data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-interface></section>

        <figure class="catalog__variation">
          <figcaption class="catalog__variationTitle">Default</figcaption>
          <yk-pad class="catalog__demo" style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-hstack>
              <p class="demoItem">First item</p>
              <p class="demoItem">Second item</p>
              <p class="demoItem">Third item</p>
            </yk-hstack>
          </yk-pad>
          <pre class="catalog__code"><code>&lt;yk-hstack&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
&lt;/yk-hstack&gt;</code></pre>
        </figure>

        <figure class="catalog__variation">
          <figcaption class="catalog__variationTitle">Custom gap</figcaption>
          <yk-pad class="catalog__demo" style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-hstack style="--yk-hstack-gap: 2rem">
              <p class="demoItem">First item</p>
              <p class="demoItem">Second item</p>
              <p class="demoItem">Third item</p>
            </yk-hstack>
          </yk-pad>
          <pre class="catalog__code"><code>&lt;yk-hstack style="--yk-hstack-gap: 2rem"&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
  &lt;p&gt;Third item&lt;/p&gt;
&lt;/yk-hstack&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer class="catalog__footer">
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
