<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-button&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js"></script>
    <script type="module" src="./catalog.js"></script>
  </head>
  <body data-component="yk-button">
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-playground></section>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-button>Default</yk-button>
          </yk-pad>
          <pre><code>&lt;yk-button&gt;Default&lt;/yk-button&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>variant="primary"</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-button variant="primary">Primary</yk-button>
          </yk-pad>
          <pre><code>&lt;yk-button variant="primary"&gt;Primary&lt;/yk-button&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>variant="secondary"</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-button variant="secondary">Secondary</yk-button>
          </yk-pad>
          <pre><code>&lt;yk-button variant="secondary"&gt;Secondary&lt;/yk-button&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>variant="danger"</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-button variant="danger">Danger</yk-button>
          </yk-pad>
          <pre><code>&lt;yk-button variant="danger"&gt;Danger&lt;/yk-button&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>Disabled</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-cluster>
              <yk-button disabled>Default</yk-button>
              <yk-button variant="primary" disabled>Primary</yk-button>
              <yk-button variant="danger" disabled>Danger</yk-button>
            </yk-cluster>
          </yk-pad>
          <pre><code>&lt;yk-button disabled&gt;Default&lt;/yk-button&gt;
&lt;yk-button variant="primary" disabled&gt;Primary&lt;/yk-button&gt;
&lt;yk-button variant="danger" disabled&gt;Danger&lt;/yk-button&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>type="submit" inside a form</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <form onsubmit="event.preventDefault()">
              <yk-vstack style="--yk-vstack-gap: var(--yk-space-sm)">
                <yk-input-text name="email" placeholder="you@example.com"></yk-input-text>
                <yk-button type="submit" variant="primary">Subscribe</yk-button>
              </yk-vstack>
            </form>
          </yk-pad>
          <pre><code>&lt;form onsubmit="event.preventDefault()"&gt;
  &lt;yk-input-text name="email" placeholder="you@example.com"&gt;&lt;/yk-input-text&gt;
  &lt;yk-button type="submit" variant="primary"&gt;Subscribe&lt;/yk-button&gt;
&lt;/form&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
