<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;yk-pad&gt; — yk-elements</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="../index.js" blocking="render"></script>
    <script type="module" src="./catalog.js" blocking="render"></script>
  </head>
  <body data-component="yk-pad">
    <yk-soft-nav></yk-soft-nav>
    <div class="catalog">
      <aside data-sidebar></aside>

      <main>
        <yk-vstack style="--yk-vstack-gap: var(--yk-space-lg)">
          <header data-component-header></header>

          <section data-playground></section>

          <section data-interface></section>

        <figure>
          <figcaption>Default</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-pad style="background: rgba(0, 0, 0, 0.04)">
              <p class="demo-item">First item</p>
              <p class="demo-item">Second item</p>
            </yk-pad>
          </yk-pad>
          <pre><code>&lt;yk-pad&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
&lt;/yk-pad&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>Custom padding</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-pad style="--yk-pad-padding: 2rem; background: rgba(0, 0, 0, 0.04)">
              <p class="demo-item">First item</p>
              <p class="demo-item">Second item</p>
            </yk-pad>
          </yk-pad>
          <pre><code>&lt;yk-pad style="--yk-pad-padding: 2rem"&gt;
  &lt;p&gt;First item&lt;/p&gt;
  &lt;p&gt;Second item&lt;/p&gt;
&lt;/yk-pad&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>Per-axis padding</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-pad
              style="
                --yk-pad-padding-block: 0.25rem;
                --yk-pad-padding-inline: 2rem;
                background: rgba(0, 0, 0, 0.04);
              "
            >
              <p class="demo-item">Tight vertical rhythm, wide horizontal inset</p>
            </yk-pad>
          </yk-pad>
          <pre><code>&lt;yk-pad
  style="--yk-pad-padding-block: 0.25rem; --yk-pad-padding-inline: 2rem"
&gt;
  &lt;p&gt;Tight vertical rhythm, wide horizontal inset&lt;/p&gt;
&lt;/yk-pad&gt;</code></pre>
        </figure>

        <figure>
          <figcaption>Composed with yk-vstack</figcaption>
          <yk-pad style="--yk-pad-padding: var(--yk-space-lg)">
            <yk-pad style="background: rgba(0, 0, 0, 0.04)">
              <yk-vstack>
                <p class="demo-item">Section heading</p>
                <p class="demo-item">First paragraph</p>
                <p class="demo-item">Second paragraph</p>
              </yk-vstack>
            </yk-pad>
          </yk-pad>
          <pre><code>&lt;yk-pad&gt;
  &lt;yk-vstack&gt;
    &lt;p&gt;Section heading&lt;/p&gt;
    &lt;p&gt;First paragraph&lt;/p&gt;
    &lt;p&gt;Second paragraph&lt;/p&gt;
  &lt;/yk-vstack&gt;
&lt;/yk-pad&gt;</code></pre>
        </figure>
        </yk-vstack>
      </main>

      <footer>
        <a href="https://github.com/yykamei/yk-elements">github.com/yykamei/yk-elements</a>
      </footer>
    </div>
  </body>
</html>
